name: tests

# Runs the Python test suite on every push and pull request, so that changes
# cannot silently alter results. The MATLAB suite (matlab/tests/test_mpt.m)
# needs a licence and is run locally; cross-language agreement is checked
# there.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python[dev]"

      - name: Run the test suite
        run: pytest python/tests -v
